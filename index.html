<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Osiągnięcie naukowe: Przestrzenie funkcji holomorficznych, operatory Carlesona i wagowe operatory złożenia.">
  <title>Przestrzenie funkcji holomorficznych, operatory Carlesona i wagowe operatory złożenia</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <!-- Wersje bibliotek są przypięte. Przed wystąpieniem przygotujemy wersję offline. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">
  <link id="reveal-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/moon.css">
  <script>
    const selectedTheme = new URLSearchParams(location.search).get('theme');
    if (selectedTheme === 'dracula') {
      document.getElementById('reveal-theme').href =
        'https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/dracula.css';
    }
  </script>
  <link rel="stylesheet" href="css/presentation.css">
</head>
<body>
<div class="reveal">
  <div class="slides">

<!-- 01. Tytuł · 0:30 · od 0:00 do 0:30 -->
<section data-slide-topic="Tytuł" data-duration-seconds="30">

<div class="slide-content title-layout">
  <div class="title-copy">
    <h1>Przestrzenie funkcji holomorficznych,<br>operatory Carlesona<br>i wagowe operatory złożenia</h1>
    <p class="affiliation">Paweł Mleczko<br>Uniwersytet im. Adama Mickiewicza w Poznaniu</p>
  </div>
  <img class="title-art" src="assets/collegium-chat-original.png" alt="Ilustracja z przezroczystym tłem: matematyczne łuki i gmach akademicki" loading="eager" decoding="async">
</div>
</section>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/notes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/plugin/zoom.js"></script>
<script>
  // Dopasowanie CAŁEGO płótna do okna. Sama regulacja wysokości przy stałej
  // szerokości pozostawiała dolny pas na szerszych ekranach (np. 21:9).
  // Zachowujemy co najmniej 1440x810 jednostek logicznych, by nie ścinać treści.
  const SLIDE_DESIGN_WIDTH = 1440;
  const SLIDE_DESIGN_HEIGHT = 810;
  function getCanvasSize() {
    const viewportWidth = Math.max(1, window.innerWidth);
    const viewportHeight = Math.max(1, window.innerHeight);
    // Reveal.js zaokrągla skalę do dwóch cyfr po przecinku. Przy 21:9,
    // 4K i niektórych poziomach zoomu oznaczało to 1–4 px pustego paska.
    // Wybieramy dokładnie taką skalę, jaką zastosuje Reveal, a logiczne
    // wymiary wyliczamy z rozmiaru rzeczywistego okna.
    const idealScale = Math.min(
      viewportWidth / SLIDE_DESIGN_WIDTH,
      viewportHeight / SLIDE_DESIGN_HEIGHT
    );
    const effectiveScale = Math.max(0.2, Math.floor(idealScale * 100) / 100);
    const width = viewportWidth / effectiveScale;
    const height = viewportHeight / effectiveScale;
    document.documentElement.style.setProperty('--slide-canvas-height', height + 'px');
    return { width, height };
  }
  const initialCanvasSize = getCanvasSize();
  Reveal.initialize({
    hash: true,
    width: initialCanvasSize.width,
    height: initialCanvasSize.height,
    margin: 0,
    minScale: 0.2,
    // Nie ograniczamy powiększenia do 1.8: na monitorach HiDPI/4K zostawiałoby to pasy.
    maxScale: 8,
    center: false,
    controls: true,
    progress: true,
    slideNumber: 'c/t',
    navigationMode: 'linear',
    totalTime: 1200,
    fragments: false,
    autoAnimate: false,
    autoSlide: 0,
    transition: 'fade',
    transitionSpeed: 'fast',
    backgroundTransition: 'fade',
    mathjax3: {
      mathjax: 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js',
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    },
    plugins: [RevealMath.MathJax3, RevealNotes, RevealZoom]
  });
  window.addEventListener('resize', () => {
    const canvas = getCanvasSize();
    const config = Reveal.getConfig();
    if (Math.abs(config.height - canvas.height) > 0.01 ||
        Math.abs(config.width - canvas.width) > 0.01) {
      Reveal.configure(canvas);
    }
  });
</script>
</body>
</html>
